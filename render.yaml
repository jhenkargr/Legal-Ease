services:
  # ========================================================
  # 1. FastAPI LangGraph RAG Service
  # ========================================================
  - type: web
    name: legalease-fastapi-rag
    env: python
    region: oregon
    plan: free
    rootDir: fastapi
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_CHAT_MODEL
        value: command-r-08-2024
      - key: COHERE_EMBED_MODEL
        value: embed-english-v3.0
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: legalease-rag
      - key: LANGCHAIN_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGCHAIN_API_KEY
        sync: false

  # ========================================================
  # 2. Node.js Express API Gateway
  # ========================================================
  - type: web
    name: legalease-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: CLIENT_URL
        value: "*"
      - key: FAST_API_URL
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_MODEL
        value: command-r-08-2024
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"

  # ========================================================
  # 3. React Vite Frontend (Static Site)
  # ========================================================
  - type: web
    name: legalease-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_EXPRESS_API_URL
        sync: false
      - key: VITE_FAST_API_URL
        sync: false
